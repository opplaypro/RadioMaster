# JVM settings for the Gradle daemon and the Kotlin compile daemon.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048M

org.gradle.parallel=true
org.gradle.caching=true
# AGP 9.5, KSP 2.3 and the Kotlin Compose plugin are all configuration-cache safe.
# Set this to false if a third-party Gradle plugin in your fork breaks the cache.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
